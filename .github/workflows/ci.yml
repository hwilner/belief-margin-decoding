name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # The CI job must never download a model checkpoint.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # CPU-only torch FIRST. The default PyPI wheel bundles CUDA and would
      # pull several GB onto the runner for nothing.
      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Integrity checks
        run: python tools/check_integrity.py

# PEP 621 packaging metadata for the belief-margin-decoding package.
#
# This file is the single source of truth for packaging metadata; setup.py is
# kept only as a thin compatibility shim for tools that still invoke it.
#
# IMPORTANT (CI): torch must be installed CPU-only in the CI environment.
# Install it first, from the PyTorch CPU index, before installing this package:
#     pip install --index-url https://download.pytorch.org/whl/cpu torch
# Installing the default (CUDA-bundled) wheel pulls a multi-gigabyte
# dependency tree onto a CPU runner for no benefit.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bmd"
version = "0.1.0"
description = "Belief-Margin Decoding: training-free, logit-level steering of a frozen LLM toward partner-belief-consistent continuations."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "hwilner" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "datasets>=2.14.0",
]

[project.urls]
Homepage = "https://github.com/hwilner/belief-margin-decoding"

[tool.setuptools]
packages = ["bmd"]

[tool.setuptools.package-dir]
bmd = "src/bmd"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: requires a model download or a long CPU run",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

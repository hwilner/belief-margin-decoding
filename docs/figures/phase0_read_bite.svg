<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica,Arial,sans-serif">
<rect width="1000" height="470" fill="#ffffff"/>
<text x="24" y="26" font-size="16" font-weight="bold" fill="#0f172a">Phase 0 — the read curve and the bite curve</text>
<text x="24" y="44" font-size="11.5" fill="#64748b">Read = out-of-fold 3-way ranking accuracy of the belief probe (chance 1/3).</text>
<text x="24" y="60" font-size="11.5" fill="#64748b">Bite = accuracy of the activation-steering arm at that layer. A layer that reads well but does not</text>
<text x="24" y="76" font-size="11.5" fill="#64748b">bite is a signal the model can read but does not use.</text>

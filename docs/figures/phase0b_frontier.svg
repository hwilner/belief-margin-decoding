<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica,Arial,sans-serif">
<rect width="1000" height="500" fill="#ffffff"/>
<text x="24" y="26" font-size="16" font-weight="bold" fill="#0f172a">Phase 0b — the belief-margin intervention is a dial, not a gain</text>
<text x="24" y="44" font-size="11.5" fill="#64748b">Layer 16, alpha = 4. Each point is a probe of a different quality; the x-axis is its achieved out-of-fold</text>
<text x="24" y="60" font-size="11.5" fill="#64748b">read accuracy (3-way, chance 1/3). The arm curve lies ON the probe diagonal: the intervention does not</text>
<text x="24" y="76" font-size="11.5" fill="#64748b">improve on the probe that produced its margin, and it crosses the base model only just above chance.</text>

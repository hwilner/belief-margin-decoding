<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .box   { fill:#ffffff; stroke:#334155; stroke-width:1.6; }
      .frozen{ fill:#eef2ff; stroke:#4338ca; stroke-width:1.6; }
      .ctrl  { fill:#fff7ed; stroke:#c2410c; stroke-width:1.6; stroke-dasharray:6 3; }
      .probe { fill:#ecfdf5; stroke:#047857; stroke-width:1.6; }
      .orc   { fill:#fef2f2; stroke:#b91c1c; stroke-width:1.6; }
      .t     { font-size:13px; fill:#0f172a; }
      .tb    { font-size:13px; fill:#0f172a; font-weight:bold; }
      .ts    { font-size:11px; fill:#475569; }
      .lbl   { font-size:12px; fill:#334155; }
      .ttl   { font-size:19px; fill:#0f172a; font-weight:bold; }
      .sub   { font-size:12px; fill:#64748b; }
    </style>
  </defs>

  <rect width="900" height="560" fill="#ffffff"/>
  <text x="30" y="34" class="ttl">Belief-Margin Decoding — the falsification matrix</text>
  <text x="30" y="55" class="sub">One frozen model, three intervention sites, one mandatory control. The question is not “does steering work” but “does it beat its own control, and can it reach the oracle?”</text>

  <!-- frozen model -->
  <rect x="30" y="90" width="250" height="130" rx="8" class="frozen"/>
  <text x="46" y="114" class="tb">Frozen LLM (no training)</text>
  <text x="46" y="134" class="ts">Qwen2.5-0.5B-Instruct · 24 decoder layers</text>
  <text x="46" y="154" class="ts">frozen weights, gradient-free</text>
  <text x="46" y="174" class="ts">single forward pass per candidate</text>
  <text x="46" y="194" class="ts">exact tokenisation of all options</text>
  <text x="46" y="212" class="ts">probe direction fitted in closed form</text>

  <!-- story input -->
  <rect x="30" y="248" width="250" height="86" rx="8" class="box"/>
  <text x="46" y="270" class="tb">Three-agent scene</text>
  <text x="46" y="290" class="ts">P away → believes original location</text>
  <text x="46" y="306" class="ts">C told → believes the told location</text>
  <text x="46" y="322" class="ts">O mover → believes the true location</text>

  <line x1="155" y1="248" x2="155" y2="222" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- probe -->
  <rect x="330" y="90" width="250" height="130" rx="8" class="probe"/>
  <text x="346" y="114" class="tb">Belief probe (read-out)</text>
  <text x="346" y="134" class="ts">Fisher-LDA on hidden states h</text>
  <text x="346" y="150" class="ts">margin m(x) = wᵀx + b</text>
  <text x="346" y="166" class="ts">train / held-out split, reported</text>
  <text x="346" y="182" class="ts">shuffled-label twin for control</text>
  <text x="346" y="202" class="ts">margins standardised (‖w‖ ≈ 10⁴ raw)</text>
  <text x="346" y="216" class="ts">→ α is comparable across layers</text>

  <line x1="280" y1="155" x2="330" y2="155" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- three mechanisms -->
  <rect x="630" y="76" width="240" height="56" rx="8" class="box"/>
  <text x="646" y="98" class="tb">① act — activation steering</text>
  <text x="646" y="118" class="ts">h ← h + α·scale·û  at layer L</text>

  <rect x="630" y="146" width="240" height="56" rx="8" class="box"/>
  <text x="646" y="168" class="tb">② margin — score re-weighting</text>
  <text x="646" y="188" class="ts">logp ← logp + α·m̂(x)</text>

  <rect x="630" y="216" width="240" height="56" rx="8" class="box"/>
  <text x="646" y="238" class="tb">③ logit — logit bias</text>
  <text x="646" y="258" class="ts">logp ← logp + α·(hᵀ(WᵀW)n)</text>

  <line x1="580" y1="140" x2="630" y2="104" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="580" y1="155" x2="630" y2="174" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="580" y1="170" x2="630" y2="244" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- control -->
  <rect x="630" y="300" width="240" height="66" rx="8" class="ctrl"/>
  <text x="646" y="322" class="tb" fill="#9a3412">④ margin_shuffled — CONTROL</text>
  <text x="646" y="341" class="ts">identical mechanism, shuffled labels</text>
  <text x="646" y="357" class="ts">an arm that does not beat this is “no effect”</text>

  <line x1="580" y1="185" x2="630" y2="325" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#arrow)"/>

  <!-- oracle -->
  <rect x="30" y="386" width="250" height="72" rx="8" class="orc"/>
  <text x="46" y="408" class="tb" fill="#991b1b">⑤ prompt_oracle — ORACLE</text>
  <text x="46" y="428" class="ts">states the belief outright in the prompt</text>
  <text x="46" y="446" class="ts">upper bound on prompt-level injection</text>

  <!-- outcome -->
  <rect x="330" y="386" width="250" height="72" rx="8" class="box"/>
  <text x="346" y="408" class="tb">Read-out</text>
  <text x="346" y="428" class="ts">partner-belief accuracy per layer</text>
  <text x="346" y="446" class="ts">+ which error mode (world / other)</text>

  <rect x="630" y="386" width="240" height="72" rx="8" class="box"/>
  <text x="646" y="408" class="tb">Decision</text>
  <text x="646" y="428" class="ts">arm beats control? beats oracle?</text>
  <text x="646" y="446" class="ts">all three outcomes publishable</text>

  <line x1="280" y1="422" x2="330" y2="422" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="580" y1="422" x2="630" y2="422" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- footer -->
  <rect x="30" y="486" width="840" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="507" class="lbl" font-weight="bold">Pre-registered rule:</text>
  <text x="46" y="525" class="lbl">an arm is only a positive result if it beats its matched control at the same α. A tie or a loss is reported in full, with the same prominence.</text>
</svg>
